<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Почта Praxis</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font: 15px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #111);
  }
  header { padding: 14px 16px; font-weight: 600; font-size: 17px; }
  .hint { color: var(--tg-theme-hint-color, #888); font-weight: 400; font-size: 13px; }
  .list { padding: 0 12px 24px; }
  .card {
    background: var(--tg-theme-secondary-bg-color, #f3f3f5);
    border-radius: 12px; padding: 12px 14px; margin: 8px 0; cursor: pointer;
  }
  .card .from { font-weight: 600; }
  .card .subj { margin-top: 2px; }
  .card .prev { color: var(--tg-theme-hint-color, #888); margin-top: 4px; font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; }
  .badge { float: right; font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-hint-color, #888); }
  .badge.drafted { color: #c80; } .badge.approved, .badge.sent { color: #2a2; }
  .view { padding: 12px 16px 32px; }
  .meta { color: var(--tg-theme-hint-color, #888); font-size: 13px; margin-bottom: 10px; }
  .body, .draft { white-space: pre-wrap; word-wrap: break-word; }
  .draft { background: var(--tg-theme-secondary-bg-color, #f3f3f5); border-radius: 12px;
    padding: 12px 14px; margin-top: 14px; }
  .draft h4 { margin: 0 0 6px; font-size: 13px; color: var(--tg-theme-hint-color, #888);
    font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 16px;
    cursor: pointer; flex: 1 1 auto; min-width: 120px;
    background: var(--tg-theme-button-color, #2da5e0); color: var(--tg-theme-button-text-color, #fff);
  }
  button.sec { background: var(--tg-theme-secondary-bg-color, #e7e7ea);
    color: var(--tg-theme-text-color, #111); }
  button:disabled { opacity: .5; cursor: default; }
  .link { color: var(--tg-theme-link-color, #2da5e0); cursor: pointer; display: inline-block;
    margin: 0 0 8px; }
  .empty, .status { color: var(--tg-theme-hint-color, #888); padding: 24px 16px; text-align: center; }
  .status.err { color: #d33; }
</style>
</head>
<body>
<div id="app"><div class="status">Загружаю ящик…</div></div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const app = document.getElementById("app");
const esc = s => (s || "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, method) {
  const headers = { "X-Telegram-Init-Data": tg ? tg.initData : "" };
  const r = await fetch(path, { method: method || "GET", headers });
  if (r.status === 403) throw new Error("Доступ только владельцу.");
  if (!r.ok) { let j = {}; try { j = await r.json(); } catch (e) {} throw new Error(j.status || j.error || ("Ошибка " + r.status)); }
  return r.json();
}

function showStatus(msg, err) {
  app.innerHTML = `<div class="status ${err ? 'err' : ''}">${esc(msg)}</div>`;
}

async function loadInbox() {
  if (tg) tg.BackButton.hide();
  showStatus("Загружаю ящик…");
  let data;
  try { data = await api("/api/inbox"); }
  catch (e) { return showStatus(e.message, true); }
  const items = data.items || [];
  if (!items.length) return showStatus("Ящик пуст — новых писем нет.");
  let html = '<header>Почтовый ящик <span class="hint">' + items.length + '</span></header><div class="list">';
  for (const e of items) {
    html += `<div class="card" onclick="openLetter('${e.hash}')">
      <span class="badge ${esc(e.status)}">${esc(e.status)}</span>
      <div class="from">${esc(e.from)}</div>
      <div class="subj">${esc(e.subject)}</div>
      <div class="prev">${esc(e.preview)}</div></div>`;
  }
  app.innerHTML = html + '</div>';
}

async function openLetter(hash) {
  showStatus("Открываю письмо…");
  let e;
  try { e = await api("/api/letter/" + hash); }
  catch (err) { return showStatus(err.message, true); }
  if (tg) { tg.BackButton.show(); tg.BackButton.onClick(loadInbox); }
  render(e);
}

function render(e) {
  let html = `<div class="view"><span class="link" onclick="loadInbox()">‹ к ящику</span>
    <div style="font-weight:600;font-size:17px">${esc(e.subject)}</div>
    <div class="meta">От: ${esc(e.from)} · ${esc(e.date)} · ${esc(e.status)}</div>
    <div class="body">${esc(e.body) || '<span class="hint">(пустое тело)</span>'}</div>`;
  if (e.draft) {
    html += `<div class="draft"><h4>Её черновик ответа</h4><div>${esc(e.draft)}</div></div>`;
  }
  html += '<div class="btns">';
  if (e.status === "sent") {
    html += '<button class="sec" disabled>✅ Отправлено</button>';
  } else if (e.draft) {
    html += `<button onclick="act('approve','${e.hash}')">✅ Одобрить и отправить</button>
             <button class="sec" onclick="compose('${e.hash}')">✍️ Переписать</button>
             <button class="sec" onclick="act('reject','${e.hash}')">🗑 Отклонить</button>`;
  } else {
    html += `<button onclick="compose('${e.hash}')">✍️ Праксис, ответь</button>
             <button class="sec" onclick="act('reject','${e.hash}')">🗑 В архив</button>`;
  }
  app.innerHTML = html + '</div></div>';
}

async function compose(hash) {
  showStatus("Праксис читает письмо и пишет ответ…");
  try {
    await api("/api/compose/" + hash, "POST");
    const e = await api("/api/letter/" + hash);
    render(e);
  } catch (err) { showStatus(err.message, true); }
}

async function act(kind, hash) {
  const verb = kind === "approve" ? "Отправляю…" : "Отклоняю…";
  if (tg && kind === "approve") tg.HapticFeedback && tg.HapticFeedback.impactOccurred("medium");
  showStatus(verb);
  try {
    const r = await api("/api/" + kind + "/" + hash, "POST");
    if (kind === "approve" && !r.ok) return showStatus(r.status || "Не отправилось", true);
    if (tg) tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
    await loadInbox();
  } catch (err) { showStatus(err.message, true); }
}

loadInbox();
</script>
</body>
</html>
