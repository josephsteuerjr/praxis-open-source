<!doctype html>
<!-- Praxis — пульт (PASS 6): плиточный хаб + разделы. Один апп: устройство, пульс, мысли,
     таски, почта, сервер, параметры. Дизайн: Telegram theme vars, тёмная/светлая сами. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Praxis — пульт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #0f1115);
  --fg: var(--tg-theme-text-color, #e8eaee);
  --muted: var(--tg-theme-hint-color, #8a919e);
  --card: var(--tg-theme-secondary-bg-color, #1a1e26);
  --acc: var(--tg-theme-button-color, #4c8dff);
  --accfg: var(--tg-theme-button-text-color, #fff);
  --link: var(--tg-theme-link-color, #6ab0ff);
  --ok: #3fbf7f; --warn: #e0a03d; --err: #e05d5d;
  --r: 16px; --r2: 12px;
  --pad: 14px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 -apple-system, system-ui, Roboto, "Segoe UI", sans-serif;
  overscroll-behavior: none; }
body { padding-bottom: env(safe-area-inset-bottom); }
.mono { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
h1, h2, h3 { margin: 0; font-weight: 700; }
button { font: inherit; border: 0; cursor: pointer; }

/* ---------- хаб ---------- */
#home { padding: calc(10px + env(safe-area-inset-top)) var(--pad) 24px; }
#homehead { display: flex; align-items: center; gap: 10px; padding: 6px 2px 14px; }
#homehead .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
#homehead .dot.ok { background: var(--ok); box-shadow: 0 0 8px color-mix(in srgb, var(--ok) 60%, transparent); }
#homehead .dot.err { background: var(--err); }
#homehead h1 { font-size: 19px; flex: 1; }
#homehead .commit { font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace;
  background: var(--card); padding: 4px 8px; border-radius: 8px; }
#tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--card); border-radius: var(--r); padding: 13px 13px 12px; text-align: left;
  color: var(--fg); display: flex; flex-direction: column; gap: 8px; min-height: 96px;
  transition: transform .08s ease, filter .15s; position: relative; overflow: hidden; }
.tile:active { transform: scale(.97); filter: brightness(1.08); }
.tile .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  font-size: 18px; background: color-mix(in srgb, var(--acc) 16%, transparent); }
.tile .nm { font-weight: 650; font-size: 14.5px; }
.tile .sub { font-size: 11.5px; color: var(--muted); min-height: 15px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .badge { position: absolute; top: 10px; right: 10px; min-width: 20px; height: 20px;
  border-radius: 10px; background: var(--acc); color: var(--accfg); font-size: 11px; font-weight: 700;
  display: none; place-items: center; padding: 0 6px; }
.tile .badge.on { display: grid; }
.diffline { display: block; white-space: pre-wrap; word-break: break-all; }
.diffadd { color: #4cd97b; } .diffdel { color: #ff7a7a; } .diffmeta { color: var(--muted); }
.tile.wide { grid-column: 1 / -1; min-height: 72px; flex-direction: row; align-items: center; }
.tile.wide .tx { flex: 1; min-width: 0; }

/* ---------- страницы ---------- */
.page { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: none;
  flex-direction: column; }
.page.on { display: flex; }
.phead { display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) var(--pad) 8px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  position: sticky; top: 0; z-index: 5; }
.phead h2 { font-size: 16.5px; flex: 1; }
.phead .back { background: var(--card); color: var(--fg); border-radius: 10px; padding: 7px 11px; font-size: 13px; }
.phead .act { background: var(--card); color: var(--fg); border-radius: 10px; padding: 7px 10px; font-size: 13px; }
.pbody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px var(--pad) 40px; }

.card { background: var(--card); border-radius: var(--r2); padding: 12px; margin: 0 0 10px; }
.card h3 { font-size: 13px; margin-bottom: 8px; color: var(--muted); font-weight: 650;
  text-transform: uppercase; letter-spacing: .04em; }
.row { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; }
.row .k { color: var(--muted); font-size: 12.5px; flex: 0 0 auto; }
.row .v { margin-left: auto; text-align: right; word-break: break-word; }
.stat-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
.stat-grid > div { background:color-mix(in srgb,var(--fg) 5%,transparent); border-radius:9px;
  padding:8px 5px; text-align:center; }
.stat-grid b { display:block; font-size:16px; }
.stat-grid span { display:block; color:var(--muted); font-size:10px; margin-top:2px; }
.list-item { padding: 10px 2px; border-bottom: 1px solid color-mix(in srgb, var(--fg) 7%, transparent); }
.list-item:last-child { border-bottom: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; }
.chip { background: var(--card); color: var(--muted); border-radius: 9px; padding: 6px 11px; font-size: 12.5px; font-weight: 600; }
.chip.on { background: var(--acc); color: var(--accfg); }
.pill { display: inline-block; font-size: 10.5px; font-weight: 700; border-radius: 7px; padding: 2px 7px; vertical-align: middle; }
.pill.new { background: color-mix(in srgb, var(--acc) 22%, transparent); color: var(--link); }
.pill.drafted { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
.pill.approved { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
.pill.gray { background: color-mix(in srgb, var(--fg) 10%, transparent); color: var(--muted); }
pre.code { background: color-mix(in srgb, var(--fg) 5%, transparent); border-radius: 10px; padding: 10px;
  overflow-x: auto; margin: 8px 0; font: 11.5px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
pre.code .add { color: var(--ok); } pre.code .del { color: var(--err); } pre.code .hunk { color: var(--link); }
.btn { background: var(--acc); color: var(--accfg); border-radius: 11px; padding: 10px 14px; font-weight: 650; font-size: 14px; }
.btn.sec { background: var(--card); color: var(--fg); }
.btn.danger { background: color-mix(in srgb, var(--err) 22%, transparent); color: var(--err); }
.btn:disabled { opacity: .45; }
.btnrow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
textarea, input[type=text] { width: 100%; background: color-mix(in srgb, var(--fg) 6%, transparent);
  color: var(--fg); border: 0; border-radius: 10px; padding: 10px 11px; font: inherit; outline: none; resize: none; }
.skel { border-radius: var(--r2); background: linear-gradient(100deg, var(--card) 40%,
  color-mix(in srgb, var(--fg) 8%, var(--card)) 50%, var(--card) 60%); background-size: 200% 100%;
  animation: sh 1.1s infinite linear; height: 64px; margin-bottom: 10px; }
@keyframes sh { to { background-position: -200% 0; } }
.empty { text-align: center; color: var(--muted); padding: 34px 10px; font-size: 13.5px; }

/* ---------- 3D ---------- */
#p-arch .pbody, #p-memgraph .pbody { padding: 0; overflow: hidden; position: relative; }
#graphwrap, #memgraphwrap { position: absolute; inset: 0; }
#graphwrap canvas, #memgraphwrap canvas { touch-action: none !important; display: block; }
#mglegend { position: absolute; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 6;
  font-size: 10.5px; color: var(--muted); background: color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter: blur(8px); border-radius: 10px; padding: 7px 9px; }
#mglegend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px 0 8px; }
#mglegend i:first-child { margin-left: 0; }
#archui { position: absolute; left: 10px; right: 10px; top: 8px; z-index: 6; display: flex; gap: 6px; }
#archui input { flex: 1; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(8px);
  box-shadow: 0 2px 12px rgba(0,0,0,.25); }
#archui .btn.sec { background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(8px); }
#legend { position: absolute; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 6;
  font-size: 10.5px; color: var(--muted); background: color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter: blur(8px); border-radius: 10px; padding: 7px 9px; }
#legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px 0 8px; }
#legend i:first-child { margin-left: 0; }

/* ---------- шит ---------- */
#sheet { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; max-height: 78%;
  background: var(--card); border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.35);
  transform: translateY(105%); transition: transform .22s ease; display: flex; flex-direction: column; }
#sheet.on { transform: translateY(0); }
#sheet .grip { width: 36px; height: 4px; border-radius: 2px; background: var(--muted); opacity: .5;
  margin: 8px auto 2px; flex: 0 0 auto; }
#sheetbody { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); }
#shade { position: fixed; inset: 0; z-index: 35; background: rgba(0,0,0,.45); opacity: 0;
  pointer-events: none; transition: opacity .2s; }
#shade.on { opacity: 1; pointer-events: auto; }

#toast { position: fixed; z-index: 60; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px); background: var(--card); color: var(--fg); padding: 10px 16px;
  border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.4); opacity: 0; transition: all .2s;
  font-size: 13.5px; max-width: 86%; text-align: center; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#envbar { position: sticky; bottom: 0; padding: 10px 0 4px; background: linear-gradient(transparent, var(--bg) 30%); display: none; }
#envbar.on { display: block; }
</style>
</head>
<body>

<div id="home">
  <div id="homehead">
    <div class="dot" id="statusdot"></div>
    <h1>Praxis — пульт</h1>
    <span class="commit" id="headcommit">…</span>
  </div>
  <div id="tiles"></div>
</div>

<div class="page" id="p-arch"><div class="phead"><button class="back" data-back>←</button><h2>Архитектура</h2><button class="act" data-refresh="arch">⟳</button><button class="act" id="greset">⌂ камера</button></div>
  <div class="pbody"><div id="graphwrap"></div>
    <div id="archui"><input id="gsearch" list="gnodes" placeholder="найти узел…" autocomplete="off"><datalist id="gnodes"></datalist></div>
    <div id="legend"></div></div></div>

<div class="page" id="p-pulse"><div class="phead"><button class="back" data-back>←</button><h2>Пульс</h2><button class="act" data-refresh="pulse">⟳</button></div><div class="pbody" id="b-pulse"></div></div>
<div class="page" id="p-overview"><div class="phead"><button class="back" data-back>←</button><h2>Обзор</h2><button class="act" data-refresh="overview">⟳</button></div><div class="pbody" id="b-overview"></div></div>
<div class="page" id="p-thoughts"><div class="phead"><button class="back" data-back>←</button><h2>Мысли</h2><button class="act" data-refresh="thoughts">⟳</button></div><div class="pbody" id="b-thoughts"></div></div>
<div class="page" id="p-tasks"><div class="phead"><button class="back" data-back>←</button><h2>Таски</h2><button class="act" data-refresh="tasks">⟳</button></div><div class="pbody" id="b-tasks"></div></div>
<div class="page" id="p-rooms"><div class="phead"><button class="back" data-back>←</button><h2>Комнаты</h2><button class="act" data-refresh="rooms">⟳</button></div><div class="pbody" id="b-rooms"></div></div>
<div class="page" id="p-contacts"><div class="phead"><button class="back" data-back>←</button><h2>Контакты и отсутствие</h2><button class="act" data-refresh="contacts">⟳</button></div><div class="pbody" id="b-contacts"></div></div>
<div class="page" id="p-mail"><div class="phead"><button class="back" data-back>←</button><h2>Почта</h2><button class="act" data-refresh="mail">⟳</button></div><div class="pbody" id="b-mail"></div></div>
<div class="page" id="p-letter"><div class="phead"><button class="back" data-back>←</button><h2 id="lettertitle">Письмо</h2></div><div class="pbody" id="b-letter"></div></div>
<div class="page" id="p-memory"><div class="phead"><button class="back" data-back>←</button><h2>Память</h2><button class="act" data-refresh="memory">⟳</button></div><div class="pbody" id="b-memory"></div></div>
<div class="page" id="p-doc"><div class="phead"><button class="back" data-back>←</button><h2 id="doctitle" class="mono" style="font-size:13px">…</h2></div><div class="pbody" id="b-doc"></div></div>
<div class="page" id="p-props"><div class="phead"><button class="back" data-back>←</button><h2>Предложения</h2><button class="act" data-refresh="props">⟳</button></div><div class="pbody" id="b-props"></div></div>
<div class="page" id="p-prop"><div class="phead"><button class="back" data-back>←</button><h2 id="proptitle">Предложение</h2></div><div class="pbody" id="b-prop"></div></div>
<div class="page" id="p-actions"><div class="phead"><button class="back" data-back>←</button><h2>Действия</h2><button class="act" data-refresh="actions">⟳</button></div><div class="pbody" id="b-actions"></div></div>
<div class="page" id="p-server"><div class="phead"><button class="back" data-back>←</button><h2>Сервер</h2><button class="act" data-refresh="server">⟳</button></div><div class="pbody" id="b-server"></div></div>
<div class="page" id="p-env"><div class="phead"><button class="back" data-back>←</button><h2>Параметры</h2></div><div class="pbody" id="b-env"></div></div>
<div class="page" id="p-brain"><div class="phead"><button class="back" data-back>←</button><h2>Мозг</h2><button class="act" data-refresh="brain">⟳</button></div><div class="pbody" id="b-brain"></div></div>
<div class="page" id="p-self"><div class="phead"><button class="back" data-back>←</button><h2>Я</h2><button class="act" data-refresh="self">⟳</button></div><div class="pbody" id="b-self"></div></div>
<div class="page" id="p-percept"><div class="phead"><button class="back" data-back>←</button><h2>Восприятие</h2><button class="act" data-refresh="percept">⟳</button></div><div class="pbody" id="b-percept"></div></div>
<div class="page" id="p-memgraph"><div class="phead"><button class="back" data-back>←</button><h2>Граф памяти</h2><button class="act" id="mgreset">⌂ камера</button></div>
  <div class="pbody"><div id="memgraphwrap"></div><div id="mglegend"></div></div></div>
<div class="page" id="p-commits"><div class="phead"><button class="back" data-back>←</button><h2>Коммиты</h2></div><div class="pbody" id="b-commits"></div></div>
<div class="page" id="p-commit"><div class="phead"><button class="back" data-back>←</button><h2 id="committitle" class="mono">…</h2></div><div class="pbody" id="b-commit"></div></div>
<div class="page" id="p-skills"><div class="phead"><button class="back" data-back>←</button><h2>Скиллы</h2></div><div class="pbody" id="b-skills"></div></div>
<div class="page" id="p-logs"><div class="phead"><button class="back" data-back>←</button><h2>Логи</h2><button class="act" data-refresh="logs">⟳</button></div><div class="pbody" id="b-logs"></div></div>

<div id="shade"></div>
<div id="sheet"><div class="grip"></div><div id="sheetbody"></div></div>
<div id="toast"></div>

<script src="/panel/vendor/3d-force-graph.min.js"></script>
<script>
"use strict";
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand();
  if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();   // фикс: апп больше не ездит с камерой
  else if ("isVerticalSwipesEnabled" in tg) tg.isVerticalSwipesEnabled = false;
}
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hap = k => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(k || "light"); } catch (e) {} };
function toast(msg, ms) { const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), ms || 2200); }

async function api(path, opts) {
  const r = await fetch(path, Object.assign({}, opts, {
    headers: Object.assign({ "X-Telegram-Init-Data": tg ? tg.initData : "",
                             "Content-Type": "application/json" }, (opts || {}).headers || {}) }));
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
const post = (p, body) => api(p, { method: "POST", body: JSON.stringify(body || {}) });

/* ---------- роутер: стек страниц + BackButton ---------- */
const stack = [];
function syncBack() { if (!tg || !tg.BackButton) return;
  stack.length ? tg.BackButton.show() : tg.BackButton.hide(); }
function open(id, onOpen) { const p = $("#p-" + id); if (!p) return;
  stack.push(id); p.classList.add("on"); syncBack(); hap();
  if (onOpen) onOpen(); }
function back() { const id = stack.pop(); if (id) $("#p-" + id).classList.remove("on");
  closeSheet(); syncBack(); }
if (tg && tg.BackButton) tg.BackButton.onClick(back);
document.addEventListener("click", e => {
  if (e.target.closest("[data-back]")) back();
  const r = e.target.closest("[data-refresh]");
  if (r) { hap(); sections[r.dataset.refresh] && sections[r.dataset.refresh](); }
});

/* ---------- шит ---------- */
function openSheet(html) { $("#sheetbody").innerHTML = html; $("#sheet").classList.add("on");
  $("#shade").classList.add("on"); }
function closeSheet() { $("#sheet").classList.remove("on"); $("#shade").classList.remove("on"); }
$("#shade").addEventListener("click", closeSheet);

/* ---------- хаб ---------- */
const TILES = [
  { id: "arch",     ic: "🕸️", nm: "Архитектура", sub: "3D-граф её кода" },
  { id: "pulse",    ic: "💓", nm: "Пульс",       sub: "…" },
  { id: "overview", ic: "🧭", nm: "Обзор",       sub: "намерения · задачи · нити · решения" },
  { id: "thoughts", ic: "💭", nm: "Мысли",       sub: "…" },
  { id: "tasks",    ic: "✅", nm: "Таски",       sub: "…" },
  { id: "props",    ic: "🛠️", nm: "Предложения", sub: "её правки — твой мёрж" },
  { id: "memory",   ic: "🗂️", nm: "Память",      sub: "люди · дневник · душа" },
  { id: "memgraph", ic: "🕸", nm: "Граф памяти", sub: "кто с кем связан" },
  { id: "actions",  ic: "🔨", nm: "Действия",    sub: "…" },
  { id: "contacts", ic: "👥", nm: "Контакты",    sub: "важные + отсутствие" },
  { id: "rooms",    ic: "🚪", nm: "Комнаты",     sub: "режимы · контекст" },
  { id: "mail",     ic: "✉️", nm: "Почта",       sub: "…" },
  { id: "server",   ic: "🖥️", nm: "Сервер",      sub: "…" },
  { id: "brain",    ic: "🧠", nm: "Мозг",        sub: "модели · ключи · фолбэк" },
  { id: "self",     ic: "🪞", nm: "Я",           sub: "версии души · деформации" },
  { id: "percept",  ic: "👁️", nm: "Восприятие",  sub: "рычаги · причины пропуска" },
  { id: "env",      ic: "🎛️", nm: "Параметры",   sub: "ручки поведения" },
  { id: "commits",  ic: "🌱", nm: "Коммиты",     sub: "история дома" },
  { id: "skills",   ic: "📚", nm: "Скиллы",      sub: "…" },
  { id: "logs",     ic: "📜", nm: "Логи",        sub: "praxis · mailbot · boot" },
];
const LOADERS = { arch: loadArch, pulse: loadPulse, overview: loadOverview, thoughts: loadThoughts, tasks: loadTasks, props: loadProps,
  memory: loadMemory, memgraph: loadMemGraph, actions: loadActions, contacts: loadContacts, rooms: loadRooms,
  mail: loadMail, server: loadServer, env: loadEnv, brain: loadBrain, self: loadSelf, percept: loadPercept,
  commits: loadCommits, skills: loadSkills, logs: loadLogs };
const sections = { pulse: loadPulse, overview: loadOverview, thoughts: loadThoughts, tasks: loadTasks, props: loadProps, mail: loadMail,
  contacts: loadContacts, rooms: loadRooms, memory: loadMemory, actions: loadActions, server: loadServer,
  brain: loadBrain, self: loadSelf, percept: loadPercept, arch: loadArch,
  logs: () => loadLogs(curLog) };
let ROLE = "owner";
const GUEST_TILES = ["arch", "memory", "actions", "pulse", "server", "commits", "skills"];
function renderTiles() {
  $("#tiles").innerHTML = TILES.filter(t => ROLE === "owner" || GUEST_TILES.includes(t.id)).map(t => `
  <button class="tile" data-t="${t.id}">
    <span class="badge" id="bdg-${t.id}"></span>
    <span class="ic">${t.ic}</span>
    <span class="nm">${t.nm}</span>

const KIND_COLOR = { core: "#5b8cff", test: "#41c98a", soul: "#c78bff", skill: "#ffa94d",
  memory: "#e6c86e", web: "#ff6b81", doc: "#9aa4b2", md: "#c78bff" };
let G = null, GDATA = null;
function loadArch() {
  const wrap = $("#graphwrap");

    g.nodes.forEach(n => kinds[n.kind] = (kinds[n.kind] || 0) + 1);
    $("#legend").innerHTML = Object.keys(kinds).map(k =>
      `<i style="background:${KIND_COLOR[k] || "#888"}"></i>${k} ${kinds[k]}`).join("");
    $("#gnodes").innerHTML = g.nodes.map(n => `<option value="${esc(n.id)}">`).join("");
    if (G) { G.graphData({ nodes: g.nodes, links: g.links }); return; } // Ф1.8: её самоправки видны по ⟳
    G = ForceGraph3D()(wrap)
      .backgroundColor(getComputedStyle(document.body).getPropertyValue("--bg").trim() || "#0f1115")
      .graphData({ nodes: g.nodes, links: g.links })

      .nodeColor(n => KIND_COLOR[n.kind] || "#888")

async function loadRooms() {

       ровно та подмена авторства, ради снятия которой поля author и заводились. */

    // реально сменили фреймворк и есть что свапать — иначе оставляем как есть, правь руками)
    if (prevFw && prevFw !== fw) {

  b.querySelectorAll("[data-bping]").forEach(el => el.onclick = async () => { hap();

    $("#brainRestartGo").onclick = async () => { hap("medium");

}
async function loadBrainUsage() {
  const box = $("#brainUsage"); if (!box) return;
  let u; try { u = await api("/api/panel/llm/usage"); }
  catch (e) { box.innerHTML = `<h3>Расход</h3><div class="muted small">${esc(e.message)}</div>`; return; }
  const days = Object.keys(u.days || {}).sort();
  if (!days.length) { box.innerHTML = `<h3>Расход</h3><div class="muted small">данных ещё нет — счётчик копится с PASS 9</div>`; return; }
  const kk = v => v >= 1e6 ? (v / 1e6).toFixed(1) + "М" : v >= 1000 ? (v / 1000).toFixed(1) + "к" : String(v);
  const today = new Date().toISOString().slice(0, 10);
  const roleRu = { voice: "голос", evaluator: "вспомогательная" };
  const dayRow = day => {
    const roles = u.days[day] || {};
    const cells = ["voice", "evaluator"].map(r => { const d = roles[r];
      if (!d || !d.calls) return "";
      const money = u.priced && u.cost[day] && u.cost[day][r] != null ? ` · $${u.cost[day][r].toFixed(2)}` : "";
      const fb = d.fallback ? ` · фб ${d.fallback}` : "";
      return `<div class="small">${roleRu[r]}: ${kk(d.in)}→${kk(d.out)} (${d.calls} выз.${fb})${money}</div>`; }).join("");
    return `<div class="list-item"><div class="small ${day === today ? "" : "muted"}"><b>${day === today ? "сегодня" : esc(day.slice(5))}</b></div>${cells || `<div class="small muted">тихо</div>`}</div>`;
  };
  // суммы за неделю
  const tot = {};
  days.forEach(day => Object.entries(u.days[day] || {}).forEach(([r, d]) => {
    const t = tot[r] = tot[r] || { in: 0, out: 0, calls: 0 };
    t.in += d.in || 0; t.out += d.out || 0; t.calls += d.calls || 0; }));
  const totLine = Object.entries(tot).map(([r, t]) => `${roleRu[r] || r}: ${kk(t.in)}→${kk(t.out)} · ${t.calls} выз.`).join(" · ");
  box.innerHTML = `<h3>Расход</h3>
    <div class="small muted" style="margin-bottom:6px">за 7 дней: ${totLine}${u.priced ? "" : " · цены не заданы — только токены (pricing в llm.json)"}</div>
    ${days.slice().reverse().map(dayRow).join("")}`;
}
async function loadAppetite() {
  const box = $("#brainAppetite"); if (!box) return;

  catch (e) { box.innerHTML = `<h3>Аппетит</h3><div class="muted small">${esc(e.message)}</div>`; return; }
  const kk = v => v >= 1e6 ? (v / 1e6).toFixed(1) + "М" : v >= 1000 ? (v / 1000).toFixed(1) + "к" : String(v);
  const obs = a.observed || {};
  const req = a.owner_request, interp = a.interpretation, plan = (interp || {}).plan || {};
  const prom = a.promise || {}, hasProm = Object.values(prom).some(v => v != null);
  const fresh = req && (!interp || (req.ts || 0) > (interp.ts || 0));
  const kindRu = { free: "не экономь", considerate: "умерь аппетиты", pause_background: "останови фон", pledge: "числовая", text: "своими словами" };
  const rows = [];
  rows.push(`<div class="row"><span class="k">режим</span><span class="v mono">${esc(a.mode)}</span></div>`);
  if (a.background_hold) rows.push(`<div class="small" style="color:var(--warn,#e6a23c)">⏸ ${esc(a.background_hold)}</div>`);
  if (req) rows.push(`<div class="small ${fresh ? "" : "muted"}">просьба Егора (${esc(req.source || "?")}): ${esc(req.raw || kindRu[req.kind] || req.kind)}${fresh ? " · <b>ждёт её толкования</b>" : ""}</div>`);
  if (interp) rows.push(`<div class="small muted">её толкование: ${esc(interp.text || "—")} (окна: ${plan.windows === false ? "нет" : "да"} · сон: ${esc(plan.sleep_depth || "full")})</div>`);
  if (hasProm) {
    const pcs = [];
    if (prom.daily_tokens != null) pcs.push(`${kk(obs.tokens_today || 0)} / ${kk(prom.daily_tokens)} ток`);
    if (prom.daily_cost != null) pcs.push(`$${obs.estimated_cost_today != null ? obs.estimated_cost_today.toFixed(2) : "?"} / $${prom.daily_cost}`);
    if (prom.background_calls != null) pcs.push(`фон ≤${prom.background_calls}`);
    rows.push(`<div class="small">обещание: ${pcs.join(" · ")}</div>`);
    if (a.promise_check) rows.push(`<div class="small" style="color:var(--err)">⚠ ${esc(a.promise_check)}</div>`);
  }
  rows.push(`<div class="small muted">сегодня: ${kk(obs.tokens_today || 0)} ток (${obs.calls_today || 0} выз.)${obs.estimated_cost_today != null ? ` · ≈$${obs.estimated_cost_today.toFixed(2)}` : ""} · остаток провайдера: ${esc(obs.provider_remaining || "unknown")}</div>`);
  if (a.external_provider_boundary && a.external_provider_boundary !== "absent")
    rows.push(`<div class="small muted">внешний лимит провайдера: ${esc(a.external_provider_boundary)} (граница Егора, не её)</div>`);
  if (a.denials_today) rows.push(`<div class="small muted">отказов рельсов сегодня: ${a.denials_today} (память/.state/denials.jsonl)</div>`);
  box.innerHTML = `<h3>Аппетит</h3>${rows.join("")}
    <div class="chips" style="margin-top:8px">
      <button class="chip" data-appk="free">не экономь</button>
      <button class="chip" data-appk="considerate">умерь аппетиты</button>
      <button class="chip" data-appk="pause_background">останови фон</button>
    </div>
    <div style="display:flex;gap:6px;margin-top:8px">
      <input type="text" id="appText" placeholder="своими словами — она истолкует" style="flex:1">
      <button class="btn sec" id="appSend">→</button>
    </div>
    <p class="small muted" style="margin-top:6px">это твоё слово — она увидит его в STATE и ответит manage_appetite;
    код не решает за неё (договор: memory/appetite.md)</p>`;
  const sendIntent = async (kind, text) => { hap();
    try { const r = await post("/api/panel/appetite/intent", { kind, text: text || "" });
      if (r.ok === false) { toast(r.error || "не записалось"); return; }
      toast("записано — она увидит на ближайшем ходе"); hap("medium"); loadAppetite(); }
    catch (e) { toast(e.message); } };
  box.querySelectorAll("[data-appk]").forEach(el => el.onclick = () => sendIntent(el.dataset.appk, ""));
  $("#appSend").onclick = () => { const t = $("#appText").value.trim();
    if (!t) { toast("пустая просьба"); return; } sendIntent("text", t); };
}
function brainCollect() {
  const b = $("#b-brain"), changes = { roles: {}, frameworks: {}, limits: {} }, diff = [];
  ["voice", "evaluator"].forEach(role => {
    const r0 = BRAIN.roles[role] || {}, out = {};
    const fwEl = b.querySelector(`[data-bfw^="${role}:"].on`);
    const fw = fwEl ? fwEl.dataset.bfw.split(":")[1] : r0.framework;
    if (fw !== r0.framework) { out.framework = fw; diff.push(`${ROLE_TITLES[role]}: фреймворк ${r0.framework} → ${fw}`); }
    b.querySelectorAll(`[data-bf^="${role}:"]`).forEach(inp => {
      const k = inp.dataset.bf.split(":")[1], v = inp.value.trim();
      if (String(v) !== String(r0[k] == null ? "" : r0[k])) { out[k] = v;
        diff.push(`${ROLE_TITLES[role]}: ${k} ${r0[k] || "—"} → ${v || "—"}`); } });
    if (Object.keys(out).length) changes.roles[role] = out;
  });
  ["anthropic", "openai"].forEach(fw => {
    const f0 = BRAIN.frameworks[fw] || {}, out = {};
    b.querySelectorAll(`[data-bfw2^="${fw}:"]`).forEach(inp => {
      const k = inp.dataset.bfw2.split(":")[1], v = inp.value.trim();
      if (k === "api_key") { if (v) { out.api_key = v; diff.push(`${fw}: новый API-ключ (••••${v.slice(-4)})`); } }
      else if (v !== (f0[k] || "")) { out[k] = v; diff.push(`${fw}: ${k} → ${v}`); } });
    if (Object.keys(out).length) changes.frameworks[fw] = out;
  });
  const lim0 = BRAIN.limits || {}, iters = parseInt($("#bIters").value, 10);
  if (iters !== Number(lim0.max_tool_iters)) { changes.limits.max_tool_iters = iters;
    diff.push(`тул-бюджет: ${lim0.max_tool_iters} → ${iters}`); }
  ["roles", "frameworks", "limits"].forEach(k => { if (!Object.keys(changes[k]).length) delete changes[k]; });
  return { changes, diff };
}
async function brainApply() {
  hap();
  const { changes, diff } = brainCollect();
  if (!diff.length) { toast("изменений нет"); return; }
  openSheet(`<h2 style="font-size:15px">Изменения мозга</h2>
    <div class="card" style="margin-top:10px">${diff.map(x => `<div class="small">${esc(x)}</div>`).join("")}</div>
    <p class="small muted">Подхват горячий (mtime); она увидит смену мозга строкой в дневнике.</p>
    <div class="btnrow"><button class="btn" id="brainGo" style="width:100%">Применить</button></div>`);
  $("#brainGo").onclick = async () => {
    try { const r = await post("/api/panel/llm/apply", { changes, confirm: true });
      if (r.ok === false) { toast((r.errors || ["не применилось"])[0]); return; }
      toast("применено"); hap("medium"); closeSheet(); loadBrain(); homeBadges(); }
    catch (e) { toast(e.message); } };
}

/* ---------- Коммиты ---------- */
const PROP_MARK = { proposed: "🟡 ждёт", merged: "🟢 смёржено", rejected: "🔴 отклонено", building: "⚪ строится" };
async function loadProps() {
  const b = $("#b-props"); b.innerHTML = `<div class="skel"></div>`;
  let d; try { d = await api("/api/panel/proposals"); } catch (e) { b.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const items = (d.items || []);
  if (!items.length) { b.innerHTML = `<div class="empty">Предложений ещё не было.<br><span class="small muted">Она открывает их сама: start_proposal → правки → submit_proposal.</span></div>`; return; }
  b.innerHTML = items.map(p => `
    <div class="list-item" data-prop="${esc(p.id)}">
      <div>${PROP_MARK[p.status] || esc(p.status)} <b>${esc(p.title || p.why || p.id)}</b></div>
      <div class="small muted">${esc(p.diffstat || "без диффа")} · тесты: ${p.tests_ok ? "✅" : "❌"}${p.zone === "protected" ? " · ⚠️ защищённая зона" : ""}${p.reason ? " · " + esc(p.reason) : ""}</div>
    </div>`).join("");
  b.querySelectorAll("[data-prop]").forEach(el => el.onclick = () => openProp(el.dataset.prop));
}
function diffHtml(t) {
  return (t || "").split("\n").map(l => {
    const e = esc(l);
    if (l.startsWith("+") && !l.startsWith("+++")) return `<span class="diffline diffadd">${e}</span>`;
    if (l.startsWith("-") && !l.startsWith("---")) return `<span class="diffline diffdel">${e}</span>`;
    if (l.startsWith("@@") || l.startsWith("diff ") || l.startsWith("index ")) return `<span class="diffline diffmeta">${e}</span>`;
    return `<span class="diffline">${e}</span>`;
  }).join("");
}
async function openProp(pid) {
  open("prop", async () => {
    const b = $("#b-prop"); b.innerHTML = `<div class="skel"></div>`;
    let p; try { p = await api("/api/panel/proposal/" + pid); } catch (e) { b.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
    $("#proptitle").textContent = "#" + p.id;
    const tests = p.tests || {};
    const act = p.status === "proposed" ? `
      <div class="card"><h3>Решение</h3>
        <input type="text" id="propReason" placeholder="причина (для отказа; уйдёт ей в дневник)">
        <div class="btnrow">
          <button class="btn" id="propApply">✅ Мёрж</button>
          <button class="btn danger" id="propReject">❌ Отклонить</button>
        </div></div>` : "";
    b.innerHTML = `
      <div class="card">
        <h3>${esc(p.title || "без названия")} · ${PROP_MARK[p.status] || esc(p.status)}</h3>
        <div class="small">${esc(p.why || "—")}</div>
        <div class="small muted" style="margin-top:6px">${esc((p.files || []).join(", ") || "—")}<br>
          ${esc(p.diffstat || "")} · зона: ${esc(p.zone || "—")}${p.decided_by ? " · решил: " + esc(p.decided_by) : ""}${p.reason ? " · " + esc(p.reason) : ""}</div>
        <div class="small" style="margin-top:6px">${tests.ok ? "✅" : "❌"} ${esc((tests.summary || "тесты не гонялись").split("\n")[0])}</div>
      </div>
      ${act}
      <div class="card"><h3>Дифф</h3><div class="mono small" style="overflow-x:auto">${diffHtml(p.diff)}</div></div>`;
    if (p.status !== "proposed") return;
    $("#propApply").onclick = async () => {
      $("#propApply").disabled = true;
      try { const r = await post("/api/panel/proposal/" + pid + "/apply", {});
        if (r.ok) { toast("смёржено — перезапустится"); hap("medium"); back(); loadProps(); }
        else toast(r.msg || r.error || "не вышло"); }
      catch (e) { toast("не вышло: " + e.message); }
      $("#propApply").disabled = false; };
    $("#propReject").onclick = async () => {
      $("#propReject").disabled = true;
      try { const r = await post("/api/panel/proposal/" + pid + "/reject", { reason: $("#propReason").value.trim() });
        if (r.ok) { toast("отклонено — она увидит причину"); hap("medium"); back(); loadProps(); }
        else toast(r.msg || r.error || "не вышло"); }
      catch (e) { toast("не вышло: " + e.message); }
      $("#propReject").disabled = false; };
  });
}
async function loadCommits() {
  const b = $("#b-commits"); b.innerHTML = `<div class="skel"></div><div class="skel"></div>`;
  let c; try { c = await api("/api/panel/commits"); } catch (e) { b.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

function colorPatch(patch) {
  return esc(patch).split("\n").map(l =>
    l.startsWith("+") && !l.startsWith("+++") ? `<span class="add">${l}</span>` :
    l.startsWith("-") && !l.startsWith("---") ? `<span class="del">${l}</span>` :
    l.startsWith("@@") ? `<span class="hunk">${l}</span>` : l).join("\n");
}
function openCommit(hash) {
  open("commit", async () => {
    $("#committitle").textContent = hash;
    const b = $("#b-commit"); b.innerHTML = `<div class="skel"></div>`;
    try { const c = await api("/api/panel/commit/" + hash);
      b.innerHTML = `<div class="card"><div>${esc(c.subject)}</div>

    } catch (e) { b.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  });
}
